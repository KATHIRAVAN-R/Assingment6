<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 GRADE CALCULATOR</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <main class="main">
        <div class="container">
            <div class="text">
                <h1>Grade Calculator</h1>
            </div>
            <form class="form form-container">
                <table>
                    <tr>
                        <th>
                            <label for="sName">Name : </label>
                        </th>
                        <td>
                            <input type="text" name="name" id="sName" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label for="tamil">Tamil : </label>
                        </th>
                        <td>
                            <input type="number" name="tam" id="tamil" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label for="english">English : </label>
                        </th>
                        <td>
                            <input type="number" name="eng" id="english" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label for="maths">Maths : </label>
                        </th>
                        <td>
                            <input type="number" name="eng" id="maths" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label for="science">Science : </label>
                        </th>
                        <td>
                            <input type="number" name="eng" id="science" required>
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label for="social">Social : </label>
                        </th>
                        <td>
                            <input type="number" name="eng" id="social" required>
                        </td>
                    </tr>
                    <tr>
                        <th colspan="2">
                            
                            <input type="button" value="click" onclick="calc()">
                        </th>
                    </tr>
                </table>
            </form>
        </div>
        <div class="result-container">
            <div class="result" id="result">
               
            </div>
        </div>
    </main>
    <script src="js/index.js"> </script>

</body>

</html>
